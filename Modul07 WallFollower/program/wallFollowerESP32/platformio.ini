; ============================================================
; PlatformIO Configuration – Modul 07 Wall Follower ESP32
; Program Studi: Teknologi Rekayasa Otomasi
; Mata Kuliah : Praktikum Mekatronika dan Robotika
; ============================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial monitor
monitor_speed = 115200

; Upload settings
upload_speed = 921600

; Library dependencies
lib_deps =
    electroniccats/MPU6050@^1.3.0
    ESP Async WebServer
    AsyncTCP
    bblanchon/ArduinoJson@^7.0.0

; Build flags: disable verbose debug logs in production
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ARDUHAL_LOG_DEFAULT_LEVEL=0
