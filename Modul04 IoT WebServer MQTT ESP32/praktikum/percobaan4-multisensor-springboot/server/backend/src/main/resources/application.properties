# ─── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ─── PostgreSQL Datasource ────────────────────────────────────────────────────
# Untuk produksi: gunakan environment variables, contoh:
#   export DB_URL=jdbc:postgresql://host:5432/iot_praktikum
#   export DB_USER=myuser   export DB_PASS=secretpassword
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/iot_praktikum}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.iot.praktikum=INFO
logging.level.org.springframework.web=INFO

# ─── CORS (global, juga di-handle via @CrossOrigin) ──────────────────────────
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
