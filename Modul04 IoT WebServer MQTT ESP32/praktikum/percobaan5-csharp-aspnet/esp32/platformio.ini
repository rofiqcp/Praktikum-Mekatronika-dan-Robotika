; PlatformIO Configuration - Percobaan 5: MQTT-HTTP Bridge
; ESP32 reads LDR + potentiometer, publishes to MQTT, subscribes for LED control

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson  @ ^6.21.3
